name: wiki

# Builds the wiki (strict + history-leak lint) on every push that touches it, so a broken link or a
# changelog-style sentence on a main page fails in the PR. Publishing to GitHub Pages is manual
# (Actions -> wiki -> Run workflow), from any branch, because main is reserved for releases.

on:
  push:
    paths: ["wiki/**", "mkdocs.yml", "tools/wiki/**", "CHANGELOG.md", ".github/workflows/wiki.yml"]
  pull_request:
    paths: ["wiki/**", "mkdocs.yml", "tools/wiki/**", "CHANGELOG.md"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish to GitHub Pages"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wiki-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/wiki/requirements.txt
      - run: python tools/wiki/check.py
      - if: github.event_name == 'workflow_dispatch' && inputs.deploy
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-wiki

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
